<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <path d="M 56 100 Q 88 60 120 100 T 184 100 T 200 100"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 56 128 Q 88 88 120 128 T 184 128 T 200 128"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- DevTools gear in icon -->
  <g transform="translate(128, 186)">
    <circle r="20" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9"/>
    <circle r="8" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-3" y="-30" width="6" height="9" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-3" y="21" width="6" height="9" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-30" y="-3" width="9" height="6" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="21" y="-3" width="9" height="6" rx="2" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="280" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="110" font-weight="700" fill="#0D47A1" letter-spacing="-3">
    cdp<tspan fill="#2196F3">wave</tspan>
  </text>
</svg>
